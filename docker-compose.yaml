services:
  postgres:
    image: postgres:17
    restart:unless-stopped
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5423"
    volumes:
      -postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data: